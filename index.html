<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Private bucket-first UPI payment launcher for personal budgeting. Standalone local build.">

<style>
:root {
  color-scheme: light dark;
  --bg: #f4f7f6;
  --surface: #ffffff;
  --surface-2: #edf3f1;
  --surface-3: #e4eeeb;
  --text: #12211d;
  --muted: #687a74;
  --border: #d9e4e0;
  --accent: #12664f;
  --accent-strong: #0c4f3c;
  --accent-text: #ffffff;
  --danger: #b42318;
  --warning: #9a6700;
  --success: #067647;
  --shadow: 0 8px 24px rgba(0,0,0,.07);
  --radius: 18px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1512;
    --surface: #14201c;
    --surface-2: #1b2b25;
    --surface-3: #22372f;
    --text: #f1f7f4;
    --muted: #a5b8b1;
    --border: #294139;
    --accent: #69d3ad;
    --accent-strong: #8be0bf;
    --accent-text: #092219;
    --danger: #ffb4ab;
    --warning: #f5d06f;
    --success: #7ee2b8;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 84px;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  min-height: 68px;
  padding: env(safe-area-inset-top) 12px 0;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(16px);
}
.brand-wrap { min-width: 0; text-align: center; }
.brand { font-weight: 760; letter-spacing: -.02em; }
.subtle { color: var(--muted); font-size: .78rem; }
.icon-btn {
  min-width: 44px; min-height: 44px; border: 0; border-radius: 14px;
  background: transparent; color: var(--text); font-size: 1.2rem; cursor: pointer;
}
.icon-btn:active { background: var(--surface-2); }
.hidden { visibility: hidden !important; pointer-events: none !important; }

main { padding: 14px 16px 32px; outline: none; }
.hero {
  padding: 18px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 24px;
  box-shadow: var(--shadow);
}
.eyebrow { color: var(--muted); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.hero-amount { margin-top: 4px; font-size: clamp(2rem, 9vw, 3.5rem); line-height: 1; font-weight: 780; letter-spacing: -.055em; }
.hero-meta { margin-top: 9px; color: var(--muted); }

.section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 24px 2px 10px; }
.section-head h2 { margin:0; font-size:1rem; }
.section-head button { flex:0 0 auto; }

.bucket-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.bucket-card {
  min-width:0; min-height:142px; padding:14px; text-align:left; border:1px solid var(--border); border-radius:18px;
  background:var(--surface); color:var(--text); cursor:pointer; box-shadow:var(--shadow);
}
.bucket-card:active { transform: scale(.99); }
.bucket-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.emoji { font-size:1.35rem; }
.bucket-name { font-weight:720; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.remaining { margin-top:18px; font-weight:770; font-size:1.2rem; letter-spacing:-.02em; }
.mini { color:var(--muted); font-size:.78rem; margin-top:4px; }
.progress { height:6px; margin-top:12px; overflow:hidden; border-radius:999px; background:var(--surface-2); }
.progress > span { display:block; height:100%; width:0; background:var(--text); border-radius:inherit; transition:width .2s ease; }
.progress.over > span { background:var(--danger); }
.progress.warn > span { background:var(--warning); }

.primary, .secondary, .danger-btn, .text-btn {
  min-height:48px; border-radius:15px; padding: 0 16px; font-weight:720; cursor:pointer;
}
.primary { border:1px solid var(--accent); background:var(--accent); color:var(--accent-text); }
.secondary { border:1px solid var(--border); background:var(--surface); color:var(--text); }
.danger-btn { border:1px solid color-mix(in srgb,var(--danger) 35%,var(--border)); background:transparent; color:var(--danger); }
.text-btn { min-height:40px; padding:0 10px; border:0; background:transparent; color:var(--text); }
.primary:disabled, .secondary:disabled { opacity:.45; cursor:not-allowed; }
.full { width:100%; }
.action-stack { display:grid; gap:10px; margin-top:16px; }
.action-row { display:flex; flex-wrap:wrap; gap:10px; }
.action-row > * { flex:1 1 150px; }

.panel { padding:16px; border:1px solid var(--border); border-radius:18px; background:var(--surface); }
.panel + .panel { margin-top:12px; }
.panel h2, .panel h3 { margin:0 0 8px; }
.notice { padding:12px 14px; border-radius:14px; background:var(--surface-2); color:var(--muted); font-size:.88rem; }
.notice.warning { color:var(--warning); }
.notice.danger { color:var(--danger); }
.notice.success { color:var(--success); }

.field { display:grid; gap:7px; margin-top:14px; }
.field label { font-size:.82rem; color:var(--muted); font-weight:650; }
.input, .select {
  width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--border); border-radius:13px;
  background:var(--surface); color:var(--text); font-size:16px; outline:none;
}
.input:focus, .select:focus { border-color:var(--text); box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 10%, transparent); }
.input[readonly] { background:var(--surface-2); }

.pay-summary { display:grid; gap:11px; }
.summary-row { display:flex; gap:12px; justify-content:space-between; align-items:flex-start; }
.summary-row .label { color:var(--muted); font-size:.84rem; }
.summary-row .value { text-align:right; font-weight:680; overflow-wrap:anywhere; }
.pay-amount { text-align:center; font-size:2.35rem; font-weight:800; letter-spacing:-.05em; padding:14px 0; }
.bucket-chip { display:inline-flex; gap:8px; align-items:center; padding:8px 10px; border-radius:999px; background:var(--surface-2); font-weight:650; }

.scanner-wrap { position:relative; overflow:hidden; border-radius:20px; background:#000; aspect-ratio: 4/5; max-height:540px; }
#scanVideo { width:100%; height:100%; object-fit:cover; display:block; }
.scan-overlay { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
.scan-frame { width:min(72%,300px); aspect-ratio:1; border:3px solid rgba(255,255,255,.9); border-radius:24px; box-shadow:0 0 0 999px rgba(0,0,0,.28); }
.scan-tip { position:absolute; bottom:14px; left:14px; right:14px; color:white; text-align:center; font-size:.82rem; text-shadow:0 1px 3px rgba(0,0,0,.6); }

.list { display:grid; gap:8px; }
.tx { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:13px 14px; border:1px solid var(--border); border-radius:15px; background:var(--surface); }
.tx-title { font-weight:680; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx-meta { margin-top:3px; color:var(--muted); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx-amount { font-weight:760; white-space:nowrap; }
.tx-actions { grid-column:1/-1; display:flex; justify-content:flex-end; }

.bucket-editor { display:grid; grid-template-columns:68px 1fr 120px auto; gap:8px; align-items:end; padding:10px 0; border-bottom:1px solid var(--border); }
.bucket-editor:last-child { border-bottom:0; }
.bucket-editor .field { margin-top:0; }

.empty { padding:28px 16px; text-align:center; color:var(--muted); }
.divider { height:1px; background:var(--border); margin:16px 0; }

.bottom-nav {
  position:fixed; z-index:30; bottom:0; left:50%; transform:translateX(-50%); width:min(720px,100%);
  display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border); background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(18px);
}
.nav-btn { min-height:52px; display:grid; place-items:center; align-content:center; gap:1px; border:0; border-radius:14px; background:transparent; color:var(--muted); cursor:pointer; }
.nav-btn span { font-size:1.15rem; line-height:1; }
.nav-btn small { font-size:.7rem; }
.nav-btn.active { color:var(--text); background:var(--surface-2); }

.toast { position:fixed; z-index:100; left:50%; bottom:94px; transform:translate(-50%,14px); max-width:min(520px,calc(100% - 32px)); padding:11px 14px; border-radius:13px; background:var(--text); color:var(--bg); opacity:0; pointer-events:none; transition:.2s ease; box-shadow:var(--shadow); font-size:.88rem; text-align:center; }
.toast.show { opacity:1; transform:translate(-50%,0); }


/* v2 UX refresh */
.app-shell { max-width: 680px; }
.topbar { min-height: 72px; padding-left:16px; padding-right:16px; }
.brand { font-size:1.05rem; }
main { padding: 10px 16px 126px; }
.hero { border-radius:28px; padding:22px; background:linear-gradient(145deg,var(--surface),var(--surface-2)); box-shadow:none; }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.hero-side { text-align:right; min-width:0; }
.hero-side strong { display:block; font-size:1.05rem; }
.hero-side span { color:var(--muted); font-size:.76rem; }
.hero-amount { font-size:clamp(2.2rem,10vw,3.7rem); }
.quick-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.quick-action { min-height:56px; display:flex; align-items:center; justify-content:center; gap:9px; border-radius:17px; border:1px solid var(--border); font-weight:760; cursor:pointer; }
.quick-action.primaryish { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
.quick-action.secondaryish { background:var(--surface); color:var(--text); }
.section-head { margin-top:26px; }
.bucket-grid { display:grid; grid-template-columns:1fr; gap:10px; }
.bucket-card-v2 { border:1px solid var(--border); border-radius:20px; background:var(--surface); padding:15px; display:grid; gap:12px; }
.bucket-main { display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:12px; align-items:center; }
.bucket-icon { width:46px; height:46px; display:grid; place-items:center; border-radius:15px; background:var(--surface-2); font-size:1.35rem; }
.bucket-copy { min-width:0; }
.bucket-copy strong { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.bucket-copy small { color:var(--muted); display:block; margin-top:3px; }
.bucket-balance { text-align:right; white-space:nowrap; }
.bucket-balance strong { display:block; font-size:1.05rem; }
.bucket-balance small { color:var(--muted); }
.bucket-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.bucket-actions button { min-height:42px; border-radius:13px; font-weight:700; cursor:pointer; }
.pay-bucket { background:var(--accent); color:var(--accent-text); border:1px solid var(--accent); }
.add-bucket-expense { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.progress { margin-top:0; }
.recent-card { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border); }
.recent-card:last-child { border-bottom:0; }
.recent-icon { width:40px; height:40px; border-radius:13px; display:grid; place-items:center; background:var(--surface-2); flex:0 0 auto; }
.recent-copy { flex:1; min-width:0; }
.recent-copy strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.recent-copy small { color:var(--muted); }
.recent-amt { font-weight:760; white-space:nowrap; }
.fab { position:fixed; z-index:35; right:max(18px,calc((100vw - 680px)/2 + 18px)); bottom:86px; min-height:52px; padding:0 18px; border-radius:999px; border:0; background:var(--accent); color:var(--accent-text); font-weight:800; box-shadow:0 10px 28px rgba(0,0,0,.18); cursor:pointer; }
.fab:active { transform:translateY(1px); }
.form-card { padding:18px; border:1px solid var(--border); border-radius:22px; background:var(--surface); }
.amount-entry { position:relative; }
.amount-entry .currency { position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:1.5rem; font-weight:760; color:var(--muted); }
.amount-entry input { min-height:68px; padding-left:42px; font-size:2rem; font-weight:800; letter-spacing:-.04em; }
.bucket-picker { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:8px; }
.bucket-choice { min-height:52px; padding:10px 12px; border-radius:15px; background:var(--surface); border:1px solid var(--border); color:var(--text); text-align:left; cursor:pointer; display:flex; align-items:center; gap:9px; }
.bucket-choice.selected { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--surface)); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 14%,transparent); }
.bucket-choice span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.form-help { color:var(--muted); font-size:.82rem; line-height:1.45; }
.date-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.empty-state { padding:28px 18px; text-align:center; border:1px dashed var(--border); border-radius:18px; color:var(--muted); }
.tx { border-radius:18px; padding:14px; }
.bottom-nav { width:min(680px,100%); }
@media (max-width:520px) { .fab { right:18px; } .date-row { grid-template-columns:1fr; } }

@media (max-width: 600px) {
  .app-shell { max-width:none; }
  main { padding:8px 14px 120px; }
  .topbar { min-height:64px; padding-left:10px; padding-right:10px; }
  .hero { padding:18px; border-radius:22px; }
  .hero-top { align-items:end; }
  .hero-amount { font-size:2.55rem; }
  .hero-side strong { font-size:1rem; }
  .quick-actions { grid-template-columns:1fr 1fr; gap:8px; }
  .quick-action { min-height:52px; padding:0 10px; font-size:.96rem; }
  .bucket-grid { grid-template-columns:1fr !important; gap:12px; }

  .bucket-actions { grid-template-columns:1fr 1fr; gap:9px; }
  .bucket-actions button { min-height:46px; font-size:.95rem; }
  .section-head { margin-top:22px; }
  .fab { right:16px; bottom:82px; width:52px; min-width:52px; height:52px; padding:0; font-size:0; border-radius:50%; }
  .fab::after { content:'+'; font-size:1.7rem; line-height:1; }
  .date-row { grid-template-columns:1fr; }
  .bucket-editor { grid-template-columns:64px minmax(0,1fr); }

}
@media (max-width: 360px) {
  main { padding-left:10px; padding-right:10px; }
  .hero { padding:16px; }
  .hero-amount { font-size:2.25rem; }
  .quick-actions, .bucket-actions { grid-template-columns:1fr; }
  .bucket-main { grid-template-columns:44px minmax(0,1fr); }
  .bucket-icon { width:44px; height:44px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
}

<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Go back">←</button>
      <div class="brand-wrap">
        <div class="brand">BucketPay</div>
        <div id="periodLabel" class="subtle"></div>
      </div>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">⚙️</button>
    </header>

    <main id="main" tabindex="-1"></main>

    <button id="quickAddBtn" class="fab" type="button">＋ Add spent</button>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button id="navHome" class="nav-btn active" type="button"><span>⌂</span><small>Home</small></button>
      <button id="navHistory" class="nav-btn" type="button"><span>↺</span><small>History</small></button>
      <button id="navSettings" class="nav-btn" type="button"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script>
const STORAGE_KEY = 'bucketpay.state.v1';
const PENDING_KEY = 'bucketpay.pending.v1';
const STATE_VERSION = 1;

function makeId(prefix = 'id') {
  if (globalThis.crypto?.randomUUID) return `${prefix}_${globalThis.crypto.randomUUID()}`;
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
}

function periodKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

function defaultState() {
  return {
    version: STATE_VERSION,
    buckets: [
      { id: 'food', name: 'Food', emoji: '🍲', limit: 10000 },
      { id: 'shopping', name: 'Shopping', emoji: '🛍️', limit: 3000 },
      { id: 'fun', name: 'Fun', emoji: '🎉', limit: 3000 },
      { id: 'transport', name: 'Transport', emoji: '🚕', limit: 4000 },
      { id: 'misc', name: 'Misc', emoji: '🧾', limit: 3000 }
    ],
    transactions: [],
    settings: {
      warnAtPercent: 80,
      lockAtLimit: true
    }
  };
}

function normalizeState(input) {
  const fallback = defaultState();
  if (!input || typeof input !== 'object') return fallback;

  const buckets = Array.isArray(input.buckets)
    ? input.buckets
        .map((b) => ({
          id: String(b.id || makeId('bucket')),
          name: String(b.name || 'Bucket').slice(0, 40),
          emoji: String(b.emoji || '💰').slice(0, 8),
          limit: clampMoney(b.limit, 0, 100000000)
        }))
        .filter((b) => b.name)
    : fallback.buckets;

  const bucketIds = new Set(buckets.map((b) => b.id));
  const transactions = Array.isArray(input.transactions)
    ? input.transactions
        .map((t) => ({
          id: String(t.id || makeId('tx')),
          bucketId: String(t.bucketId || ''),
          bucketName: String(t.bucketName || ''),
          merchant: String(t.merchant || 'UPI payment').slice(0, 120),
          vpa: String(t.vpa || '').slice(0, 150),
          amount: clampMoney(t.amount, 0.01, 100000000),
          timestamp: Number.isFinite(Number(t.timestamp)) ? Number(t.timestamp) : Date.now(),
          period: /^\d{4}-\d{2}$/.test(String(t.period || ''))
            ? String(t.period)
            : periodKey(new Date(Number(t.timestamp) || Date.now())),
          note: String(t.note || '').slice(0, 200)
        }))
        .filter((t) => bucketIds.has(t.bucketId) && Number.isFinite(t.amount) && t.amount > 0)
    : [];

  return {
    version: STATE_VERSION,
    buckets: buckets.length ? buckets : fallback.buckets,
    transactions,
    settings: {
      warnAtPercent: Math.min(100, Math.max(1, Number(input.settings?.warnAtPercent) || 80)),
      lockAtLimit: input.settings?.lockAtLimit !== false
    }
  };
}

function clampMoney(value, min = 0, max = 100000000) {
  const n = Number(value);
  if (!Number.isFinite(n)) return min;
  return Math.min(max, Math.max(min, Math.round((n + Number.EPSILON) * 100) / 100));
}

function parseAmount(value) {
  const text = String(value ?? '').trim().replace(/,/g, '');
  if (!/^\d+(?:\.\d{1,2})?$/.test(text)) return null;
  const amount = Number(text);
  if (!Number.isFinite(amount) || amount <= 0 || amount > 100000000) return null;
  return Math.round(amount * 100) / 100;
}

function parseUpiQr(raw) {
  const text = String(raw || '').trim();
  if (!text) return { ok: false, error: 'QR code is empty.' };

  let url;
  try {
    url = new URL(text);
  } catch {
    return { ok: false, error: 'This QR is not a valid UPI payment QR.' };
  }

  if (url.protocol.toLowerCase() !== 'upi:' || url.hostname.toLowerCase() !== 'pay') {
    return { ok: false, error: 'This QR is not a UPI payment QR (upi://pay).' };
  }

  const pa = (url.searchParams.get('pa') || '').trim();
  if (!pa) return { ok: false, error: 'The UPI QR does not contain a payee address (pa).' };

  const rawAmount = (url.searchParams.get('am') || '').trim();
  let fixedAmount = null;
  if (rawAmount) {
    fixedAmount = parseAmount(rawAmount);
    if (fixedAmount === null) {
      return { ok: false, error: 'The UPI QR contains an invalid amount.' };
    }
  }

  const currency = (url.searchParams.get('cu') || 'INR').toUpperCase();
  if (currency !== 'INR') {
    return { ok: false, error: `This app currently supports INR UPI payments only (QR says ${currency}).` };
  }

  return {
    ok: true,
    raw: text,
    url,
    payeeVpa: pa,
    payeeName: (url.searchParams.get('pn') || '').trim(),
    merchantCode: (url.searchParams.get('mc') || '').trim(),
    note: (url.searchParams.get('tn') || '').trim(),
    fixedAmount,
    currency
  };
}

function buildUpiPaymentUri(parsed, amount) {
  if (!parsed?.ok || !parsed.url) throw new Error('A valid parsed UPI QR is required.');
  const validAmount = parseAmount(amount);
  if (validAmount === null) throw new Error('A valid positive amount is required.');

  const url = new URL(parsed.url.toString());
  url.searchParams.set('am', validAmount.toFixed(2));
  url.searchParams.set('cu', 'INR');
  return url.toString();
}


function buildAndroidIntentUri(upiUri, packageName) {
  const url = new URL(String(upiUri));
  if (url.protocol.toLowerCase() !== 'upi:' || url.hostname.toLowerCase() !== 'pay') {
    throw new Error('A valid upi://pay URI is required.');
  }
  if (!/^[A-Za-z0-9._]+$/.test(String(packageName || ''))) {
    throw new Error('A valid Android package name is required.');
  }
  const target = `${url.hostname}${url.pathname}${url.search}`;
  return `intent://${target}#Intent;scheme=upi;package=${packageName};end`;
}

function spentForBucket(state, bucketId, period = periodKey()) {
  return state.transactions
    .filter((t) => t.bucketId === bucketId && t.period === period)
    .reduce((sum, t) => sum + Number(t.amount || 0), 0);
}

function bucketSnapshot(state, bucketId, period = periodKey()) {
  const bucket = state.buckets.find((b) => b.id === bucketId);
  if (!bucket) return null;
  const spent = Math.round(spentForBucket(state, bucketId, period) * 100) / 100;
  const remaining = Math.round((bucket.limit - spent) * 100) / 100;
  const percent = bucket.limit > 0 ? (spent / bucket.limit) * 100 : spent > 0 ? 100 : 0;
  return { ...bucket, spent, remaining, percent };
}

function totalSnapshot(state, period = periodKey()) {
  const rows = state.buckets.map((b) => bucketSnapshot(state, b.id, period));
  const limit = rows.reduce((s, r) => s + r.limit, 0);
  const spent = rows.reduce((s, r) => s + r.spent, 0);
  const remaining = limit - spent;
  return {
    limit: Math.round(limit * 100) / 100,
    spent: Math.round(spent * 100) / 100,
    remaining: Math.round(remaining * 100) / 100
  };
}

function addTransaction(state, payment) {
  const bucket = state.buckets.find((b) => b.id === payment.bucketId);
  if (!bucket) throw new Error('Bucket not found.');
  const amount = parseAmount(payment.amount);
  if (amount === null) throw new Error('Invalid transaction amount.');
  const timestamp = Number(payment.timestamp) || Date.now();

  state.transactions.unshift({
    id: makeId('tx'),
    bucketId: bucket.id,
    bucketName: bucket.name,
    merchant: String(payment.merchant || payment.vpa || 'UPI payment').slice(0, 120),
    vpa: String(payment.vpa || '').slice(0, 150),
    amount,
    timestamp,
    period: periodKey(new Date(timestamp)),
    note: String(payment.note || '').slice(0, 200)
  });
  return state;
}

function removeTransaction(state, transactionId) {
  state.transactions = state.transactions.filter((t) => t.id !== transactionId);
  return state;
}

function formatInr(amount) {
  const n = Number(amount) || 0;
  return new Intl.NumberFormat('en-IN', {
    style: 'currency',
    currency: 'INR',
    maximumFractionDigits: Number.isInteger(n) ? 0 : 2
  }).format(n);
}

const navHistory = $('#navHistory');

let currentScan = null;
let selectedBucketId = null;
let installPrompt = null;
let launchedPendingThisSession = false;

const memoryStore = new Map();
let persistentStorageAvailable = true;

function storageGet(key) {
  try { return localStorage.getItem(key); }
  catch { persistentStorageAvailable = false; return memoryStore.get(key) ?? null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); }
  catch { persistentStorageAvailable = false; memoryStore.set(key, value); }
}
function storageRemove(key) {
  try { localStorage.removeItem(key); }
  catch { persistentStorageAvailable = false; memoryStore.delete(key); }
}

function loadState() {
  try {
    return normalizeState(JSON.parse(storageGet(STORAGE_KEY)));
  } catch {
    return defaultState();
  }
}

function saveState() {
  storageSet(STORAGE_KEY, JSON.stringify(state));
}

function readPending() {
  try { return JSON.parse(storageGet(PENDING_KEY)); } catch { return null; }
}
function writePending(pending) { storageSet(PENDING_KEY, JSON.stringify(pending)); }
function clearPending() { storageRemove(PENDING_KEY); launchedPendingThisSession = false; }

function esc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function monthLabel() {
  return new Intl.DateTimeFormat('en-IN', { month: 'long', year: 'numeric' }).format(new Date());
}

function notify(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(notify._timer);
  notify._timer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function setRoute(name, data = {}) {
  stopScanner();
  route = { name, ...data };
  render();
  requestAnimationFrame(() => main.focus({ preventScroll: true }));
}

function syncChrome() {
  periodLabel.textContent = monthLabel();
  backBtn.classList.toggle('hidden', ['home', 'history', 'settings'].includes(route.name));
  quickAddBtn.classList.toggle('hidden', route.name === 'addExpense' || route.name === 'scanner' || route.name === 'payment' || route.name === 'pending');
  settingsBtn.classList.toggle('hidden', route.name === 'settings');
  navHome.classList.toggle('active', route.name === 'home');
  navHistory.classList.toggle('active', route.name === 'history');
  navSettings.classList.toggle('active', route.name === 'settings');
}

function render() {
  syncChrome();
  if (route.name === 'home') renderHome();
  else if (route.name === 'scanner') renderScanner();
  else if (route.name === 'payment') renderPayment();
  else if (route.name === 'pending') renderPending();
  else if (route.name === 'addExpense') renderAddExpense();
  else if (route.name === 'history') renderHistory();
  else if (route.name === 'settings') renderSettings();
  else renderHome();
}

  main.innerHTML = `
    <section class="hero">

        <div class="hero-side"><strong>${formatInr(total.spent)}</strong><span>spent of ${formatInr(total.limit)}</span></div>
      </div>
      <div class="progress ${total.remaining < 0 ? 'over' : pct >= state.settings.warnAtPercent ? 'warn' : ''}" style="margin-top:18px"><span style="width:${pct.toFixed(1)}%"></span></div>
      <div class="quick-actions">
        <button id="homePayBtn" class="quick-action primaryish" type="button">▣ Scan & pay</button>

    </section>

    <div class="section-head"><h2>Your buckets</h2><button id="editBucketsBtn" class="text-btn" type="button">Edit</button></div>
    <section class="bucket-grid">${cards}</section>

    <div class="section-head"><h2>Recent</h2><button id="seeHistoryBtn" class="text-btn" type="button">See all</button></div>
    <section class="panel" style="padding:4px 14px">${recentHtml}</section>
    ${persistentStorageAvailable ? '' : '<div class="notice warning" style="margin-top:12px"><strong>Storage warning:</strong> this viewer blocked persistent storage. Use the HTTPS version so your data persists.</div>'}`;

  $('#homePayBtn').addEventListener('click', () => {
    if (state.buckets.length === 1) { selectedBucketId = state.buckets[0].id; setRoute('scanner',{bucketId:selectedBucketId}); return; }
    setRoute('addExpense', { mode:'pickPay' });
  });
  $('#homeAddBtn').addEventListener('click', () => setRoute('addExpense'));
  $('#editBucketsBtn').addEventListener('click', () => setRoute('settings'));
  $('#seeHistoryBtn').addEventListener('click', () => setRoute('history'));

function renderScanner() {
  const bucket = state.buckets.find((b) => b.id === route.bucketId);
  if (!bucket) return setRoute('home');
  selectedBucketId = bucket.id;

  main.innerHTML = `
    <section class="panel">
      <div class="bucket-chip">${esc(bucket.emoji)} ${esc(bucket.name)} · ${formatInr(bucketSnapshot(state, bucket.id).remaining)} left</div>

    </section>

async function getDetector() {
  if (!('BarcodeDetector' in window)) return null;
  try {
    const formats = await BarcodeDetector.getSupportedFormats?.();
    if (Array.isArray(formats) && !formats.includes('qr_code')) return null;
    return new BarcodeDetector({ formats: ['qr_code'] });
  } catch {
    try { return new BarcodeDetector(); } catch { return null; }
  }
}

async function startScanner() {
  const video = $('#scanVideo');
  const tip = $('#scanTip');
  const message = $('#scanMessage');
  if (!video || route.name !== 'scanner') return;

  scanner.detector = await getDetector();
  if (!scanner.detector) {
    tip.textContent = 'QR detector unavailable';
    message.innerHTML = '<strong>This browser does not expose its built-in QR detector here.</strong> Try current Chrome. You can still paste/type the UPI link below. For guaranteed live scanning, use the HTTPS version.';
    return;
  }

  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    tip.textContent = 'Local-file mode';
    message.innerHTML = '<strong>Local-file mode:</strong> tap “Take / choose QR photo” below. A live camera preview requires the HTTPS version.';
    return;
  }

  try {
    scanner.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } }
    });
    if (route.name !== 'scanner') return stopScanner();
    scanner.video = video;
    video.srcObject = scanner.stream;
    await video.play();
    tip.textContent = 'Point at a UPI QR';
    message.textContent = 'Scanning happens on this device. The camera feed is not uploaded.';
    scanLoop();
  } catch (err) {
    tip.textContent = 'Camera permission needed';
    message.textContent = err?.name === 'NotAllowedError'
      ? 'Camera permission was blocked. Allow camera access for this site, or use “Take / choose QR photo”.'
      : 'Could not start the camera. Try “Take / choose QR photo” instead.';
  }
}

async function scanLoop() {
  if (route.name !== 'scanner' || !scanner.video || !scanner.detector) return;
  if (!scanner.busy && scanner.video.readyState >= 2) {
    scanner.busy = true;
    try {
      const codes = await scanner.detector.detect(scanner.video);
      if (codes?.length && codes[0].rawValue) {
        await stopScanner();
        handleDecodedQr(codes[0].rawValue);
        return;
      }
    } catch { /* ignore intermittent frame errors */ }
    scanner.busy = false;
  }
  scanner.timer = setTimeout(scanLoop, 220);
}

async function stopScanner() {
  if (scanner.timer) clearTimeout(scanner.timer);
  scanner.timer = null;
  scanner.busy = false;
  if (scanner.video) {
    try { scanner.video.pause(); } catch {}
    scanner.video.srcObject = null;
  }
  if (scanner.stream) scanner.stream.getTracks().forEach((t) => t.stop());
  scanner.stream = null;
  scanner.video = null;
  scanner.detector = null;
}

async function scanImageFile(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const detector = scanner.detector || await getDetector();
  if (!detector) return notify('QR detection is unavailable here. Use current Chrome or paste the UPI link.');
  try {
    const bitmap = await createImageBitmap(file);
    const codes = await detector.detect(bitmap);
    bitmap.close?.();
    if (!codes?.length) return notify('No QR code found in that image.');
    await stopScanner();
    handleDecodedQr(codes[0].rawValue);
  } catch {
    notify('Could not read that image.');
  } finally {
    event.target.value = '';
  }
}

function handleDecodedQr(raw) {
  const parsed = parseUpiQr(raw);
  if (!parsed.ok) {
    notify(parsed.error);
    if (route.name !== 'scanner') setRoute('scanner', { bucketId: selectedBucketId });
    return;
  }
  currentScan = parsed;
  setRoute('payment', { bucketId: selectedBucketId });
}

function renderPayment() {
  const bucket = state.buckets.find((b) => b.id === route.bucketId);
  if (!bucket || !currentScan) return setRoute('home');
  const snap = bucketSnapshot(state, bucket.id);
  const hasFixed = currentScan.fixedAmount !== null;
  const amountValue = hasFixed ? currentScan.fixedAmount.toFixed(2) : '';

  main.innerHTML = `
    <section class="panel pay-summary">
      <div class="bucket-chip">${esc(bucket.emoji)} ${esc(bucket.name)} · ${formatInr(snap.remaining)} left</div>
      <div class="summary-row"><div class="label">Payee</div><div class="value">${esc(currentScan.payeeName || currentScan.payeeVpa)}</div></div>
      ${currentScan.payeeName ? `<div class="summary-row"><div class="label">UPI ID</div><div class="value">${esc(currentScan.payeeVpa)}</div></div>` : ''}
      ${currentScan.note ? `<div class="summary-row"><div class="label">QR note</div><div class="value">${esc(currentScan.note)}</div></div>` : ''}
      <div class="field">
        <label for="amountInput">Amount ${hasFixed ? '· fixed by QR' : '· QR has no amount'}</label>
        <input id="amountInput" class="input" type="text" inputmode="decimal" autocomplete="off" placeholder="₹0" value="${esc(amountValue)}" ${hasFixed ? 'readonly' : ''}>
      </div>
      <div id="amountImpact" class="notice">${hasFixed ? 'Amount detected from QR.' : 'Enter the amount you want to pay.'}</div>
    </section>
    <div class="action-stack">
      <button id="openGpayBtn" class="primary full" type="button" ${hasFixed ? '' : 'disabled'}>Open Google Pay</button>
      <button id="openUpiBtn" class="secondary full" type="button" ${hasFixed ? '' : 'disabled'}>Other UPI app</button>
      <button id="rescanBtn" class="secondary full" type="button">Scan again</button>
    </div>
    <div class="notice" style="margin-top:12px">Your UPI app performs the actual payment and asks for your UPI PIN. BucketPay only launches the UPI payment link.</div>`;

  const amountInput = $('#amountInput');
  const openBtn = $('#openUpiBtn');
  const gpayBtn = $('#openGpayBtn');
  const impact = $('#amountImpact');

  function validate() {
    const amount = parseAmount(amountInput.value);
    if (amount === null) {
      impact.className = 'notice';
      impact.textContent = hasFixed ? 'Invalid QR amount.' : 'Enter a valid amount greater than ₹0.';
      openBtn.disabled = true;
      gpayBtn.disabled = true;
      return;
    }
    const after = Math.round((snap.remaining - amount) * 100) / 100;
    if (state.settings.lockAtLimit && amount > snap.remaining) {
      impact.className = 'notice danger';
      impact.textContent = `${formatInr(amount)} would exceed ${bucket.name} by ${formatInr(Math.abs(after))}. Increase the bucket limit or choose another bucket.`;
      openBtn.disabled = true;
      gpayBtn.disabled = true;
      return;
    }
    const low = snap.limit > 0 && ((snap.spent + amount) / snap.limit) * 100 >= state.settings.warnAtPercent;
    impact.className = `notice ${low ? 'warning' : 'success'}`;
    impact.textContent = `After payment: ${formatInr(after)} left in ${bucket.name}.`;
    openBtn.disabled = false;
    gpayBtn.disabled = false;
  }

  amountInput.addEventListener('input', validate);
  gpayBtn.addEventListener('click', () => launchUpi(bucket, parseAmount(amountInput.value), 'gpay'));
  openBtn.addEventListener('click', () => launchUpi(bucket, parseAmount(amountInput.value), 'any'));
  $('#rescanBtn').addEventListener('click', () => { currentScan = null; setRoute('scanner', { bucketId: bucket.id }); });
  validate();
}

function launchUpi(bucket, amount, target = 'any') {
  if (!currentScan || !amount) return;
  const payUri = buildUpiPaymentUri(currentScan, amount);
  const launchUri = target === 'gpay'
    ? buildAndroidIntentUri(payUri, 'com.google.android.apps.nbu.paisa.user')
    : payUri;
  const pending = {
    id: makeId('pending'),
    bucketId: bucket.id,
    merchant: currentScan.payeeName || currentScan.payeeVpa,
    vpa: currentScan.payeeVpa,
    note: currentScan.note || '',
    amount,
    startedAt: Date.now(),
    uri: payUri,
    launchUri,
    target
  };
  writePending(pending);
  launchedPendingThisSession = true;
  notify('Opening your UPI app…');

  // Generic UPI intent: Android will typically open the default app or show a chooser.
  window.location.href = launchUri;

  // If no app handles the URI, keep a visible recovery path.
  setTimeout(() => {
    if (document.visibilityState === 'visible' && readPending()?.id === pending.id) {
      setRoute('pending');
    }
  }, 1700);
}

function renderPending() {
  const pending = readPending();
  if (!pending) return setRoute('home');
  const bucket = state.buckets.find((b) => b.id === pending.bucketId);
  if (!bucket) { clearPending(); return setRoute('home'); }

  main.innerHTML = `
    <section class="panel">
      <div class="eyebrow">Confirm after returning from UPI app</div>
      <div class="pay-amount">${formatInr(pending.amount)}</div>
      <div class="pay-summary">
        <div class="summary-row"><div class="label">Payee</div><div class="value">${esc(pending.merchant)}</div></div>
        <div class="summary-row"><div class="label">From bucket</div><div class="value">${esc(bucket.emoji)} ${esc(bucket.name)}</div></div>
      </div>
      <div class="notice warning" style="margin-top:16px">A personal PWA cannot securely verify the bank transaction by itself. Confirm only if your UPI app shows the payment succeeded.</div>
    </section>
    <div class="action-stack">
      <button id="paidYes" class="primary full" type="button">Yes, payment succeeded</button>
      <button id="retryPayment" class="secondary full" type="button">Open UPI app again</button>
      <button id="paidNo" class="secondary full" type="button">No, cancel this attempt</button>
    </div>`;

  $('#paidYes').addEventListener('click', () => {
    addTransaction(state, pending);
    saveState();
    clearPending();
    currentScan = null;
    notify(`Deducted ${formatInr(pending.amount)} from ${bucket.name}.`);

  });

    launchedPendingThisSession = true;
    window.location.href = pending.launchUri || pending.uri;
  });
  $('#paidNo').addEventListener('click', () => {
    clearPending();
    currentScan = null;
    notify('Payment attempt cancelled. Nothing deducted.');
    setRoute('home');
  });
}

function renderHistory() {
  const rows = state.transactions.filter((t) => t.period === periodKey());
  main.innerHTML = `
    <div class="section-head"><h2>${esc(monthLabel())}</h2><button id="historyAdd" class="text-btn" type="button">+ Expense</button></div>

          <div class="tx-amount">-${formatInr(t.amount)}</div>
          <div class="tx-actions"><button class="text-btn" data-delete-tx="${esc(t.id)}" type="button">Undo</button></div>

function localDateTimeValue(ts = Date.now()) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderAddExpense() {
  const isPickPay = route.mode === 'pickPay';
  let chosen = route.bucketId || state.buckets[0]?.id || '';
  const choices = state.buckets.map(b => {
    const snap = bucketSnapshot(state,b.id);
    return `<button type="button" class="bucket-choice ${b.id===chosen?'selected':''}" data-choose-bucket="${esc(b.id)}"><span>${esc(b.emoji)}</span><span>${esc(b.name)} · ${formatInr(snap.remaining)} left</span></button>`;
  }).join('');

  if (isPickPay) {
    main.innerHTML = `
      <section class="form-card">
        <div class="eyebrow">Choose where this payment belongs</div>
        <h2 style="margin:6px 0 4px">Pay from which bucket?</h2>
        <p class="form-help" style="margin:0 0 12px">You’ll scan the merchant QR immediately after choosing.</p>
        <div class="bucket-picker">${choices}</div>
        <div class="action-stack"><button id="continuePayBtn" class="primary full" type="button">Continue to scanner</button></div>
      </section>`;
    const update = id => { chosen=id; main.querySelectorAll('.bucket-choice').forEach(x=>x.classList.toggle('selected',x.dataset.chooseBucket===id)); };
    main.querySelectorAll('[data-choose-bucket]').forEach(btn=>btn.addEventListener('click',()=>update(btn.dataset.chooseBucket)));
    $('#continuePayBtn').addEventListener('click',()=>{ selectedBucketId=chosen; setRoute('scanner',{bucketId:chosen}); });
    return;
  }

  main.innerHTML = `
    <section class="form-card">
      <div class="eyebrow">Already paid elsewhere?</div>
      <h2 style="margin:6px 0 4px">Record spending</h2>
      <p class="form-help" style="margin:0 0 16px">Use this for something you paid directly in GPay, PhonePe, cash, card, etc. Recording it keeps your bucket accurate.</p>

      <div class="field"><label>Amount</label><div class="amount-entry"><span class="currency">₹</span><input id="manualAmount" class="input" inputmode="decimal" autocomplete="off" placeholder="0"></div></div>

      <div class="field"><label>Bucket</label><div class="bucket-picker" id="manualBucketPicker">${choices}</div></div>

      <div class="field"><label for="manualMerchant">What was it for?</label><input id="manualMerchant" class="input" maxlength="120" placeholder="e.g. Dinner, Amazon, Auto"></div>

      <div class="date-row">
        <div class="field"><label for="manualWhen">When</label><input id="manualWhen" class="input" type="datetime-local" value="${localDateTimeValue()}"></div>
        <div class="field"><label for="manualNote">Note (optional)</label><input id="manualNote" class="input" maxlength="200" placeholder="Anything useful"></div>
      </div>

      <div id="manualImpact" class="notice" style="margin-top:16px">Enter an amount to see the bucket impact.</div>
      <div class="action-stack"><button id="saveManualExpense" class="primary full" type="button" disabled>Record expense</button></div>
    </section>`;

  const amountEl=$('#manualAmount'), impact=$('#manualImpact'), save=$('#saveManualExpense');
  const updateChoice=id=>{chosen=id; main.querySelectorAll('.bucket-choice').forEach(x=>x.classList.toggle('selected',x.dataset.chooseBucket===id)); validate();};
  main.querySelectorAll('[data-choose-bucket]').forEach(btn=>btn.addEventListener('click',()=>updateChoice(btn.dataset.chooseBucket)));

  function validate(){
    const amount=parseAmount(amountEl.value); const snap=bucketSnapshot(state,chosen);
    if(amount===null || !snap){ impact.className='notice'; impact.textContent='Enter a valid amount greater than ₹0.'; save.disabled=true; return; }
    const after=Math.round((snap.remaining-amount)*100)/100;
    save.disabled=false;
    if(after<0){ impact.className='notice warning'; impact.textContent=`This puts ${snap.name} ${formatInr(Math.abs(after))} over budget. That’s okay here because you’re recording money already spent.`; }
    else { impact.className='notice success'; impact.textContent=`After recording: ${formatInr(after)} left in ${snap.name}.`; }
  }
  amountEl.addEventListener('input',validate); validate();

  $('#saveManualExpense').addEventListener('click',()=>{
    const amount=parseAmount(amountEl.value); if(amount===null) return;
    const when=$('#manualWhen').value ? new Date($('#manualWhen').value).getTime() : Date.now();
    if(!Number.isFinite(when)) return notify('Choose a valid date and time.');
    const merchant=$('#manualMerchant').value.trim() || 'Recorded expense';
    const note=$('#manualNote').value.trim();
    addTransaction(state,{bucketId:chosen,amount,merchant,vpa:'',note:note || 'Manual entry',timestamp:when});
    saveState();
    notify(`${formatInr(amount)} recorded.`);
    setRoute('home');
  });
}

function renderSettings() {
  main.innerHTML = `
    <section class="panel">
      <h2>Monthly buckets</h2>
      <div class="mini">Limits repeat each calendar month. Spending automatically starts from zero in the new month because transactions are tracked by month.</div>
      <div id="bucketEditors" style="margin-top:10px">
        ${state.buckets.map((b) => `
          <div class="bucket-editor" data-edit-bucket="${esc(b.id)}">
            <div class="field"><label>Emoji</label><input class="input emoji-input" value="${esc(b.emoji)}" maxlength="8"></div>
            <div class="field"><label>Name</label><input class="input name-input" value="${esc(b.name)}" maxlength="40"></div>
            <div class="field limit-field"><label>₹ / month</label><input class="input limit-input" type="number" inputmode="decimal" min="0" step="100" value="${esc(b.limit)}"></div>
            <div class="delete-cell"><button class="danger-btn delete-bucket" type="button" aria-label="Delete ${esc(b.name)}">Delete</button></div>
          </div>`).join('')}
      </div>
      <div class="action-row" style="margin-top:14px"><button id="addBucketBtn" class="secondary" type="button">+ Add bucket</button><button id="saveBucketsBtn" class="primary" type="button">Save changes</button></div>
    </section>

    <section class="panel">
      <h2>Impulse-control rules</h2>
      <label class="field"><span>Warn me after this % is used</span><input id="warnPercent" class="input" type="number" min="1" max="100" value="${esc(state.settings.warnAtPercent)}"></label>
      <label style="display:flex;align-items:center;gap:10px;margin-top:16px"><input id="lockLimit" type="checkbox" ${state.settings.lockAtLimit ? 'checked' : ''}> <span>Block payment launch if bucket would go over limit</span></label>
    </section>

    <section class="panel">
      <h2>Install & privacy</h2>
      <div class="mini">All budgets and transaction notes stay in this browser's local storage. No account, bank credentials, or UPI PIN are collected.</div>
      <div class="action-stack">
        <button id="installBtn" class="secondary full" type="button" disabled>Install from browser menu</button>
        <button id="exportBtn" class="secondary full" type="button">Export backup</button>
        <button id="importBtn" class="secondary full" type="button">Import backup</button>
        <button id="resetBtn" class="danger-btn full" type="button">Reset all local data</button>
      </div>
    </section>

    <section class="notice" style="margin-top:12px">
      On your GitHub Pages HTTPS URL, camera access and persistent browser storage work normally. Your balances and history remain local to this browser/device.
    </section>`;

  $('#addBucketBtn').addEventListener('click', () => {
    state.buckets.push({ id: makeId('bucket'), name: 'New bucket', emoji: '💰', limit: 1000 });
    saveState();
    renderSettings();
  });

  main.querySelectorAll('.delete-bucket').forEach((btn) => btn.addEventListener('click', () => {
    const row = btn.closest('[data-edit-bucket]');
    const id = row.dataset.editBucket;
    const bucket = state.buckets.find((b) => b.id === id);
    if (state.buckets.length <= 1) return notify('Keep at least one bucket.');
    const hasTx = state.transactions.some((t) => t.bucketId === id);
    if (hasTx) return notify('This bucket has history. Rename it instead of deleting it.');
    if (!confirm(`Delete ${bucket?.name || 'this bucket'}?`)) return;
    state.buckets = state.buckets.filter((b) => b.id !== id);
    saveState();
    renderSettings();
  }));

  $('#saveBucketsBtn').addEventListener('click', saveSettingsForm);
  $('#warnPercent').addEventListener('change', saveSettingsForm);
  $('#lockLimit').addEventListener('change', saveSettingsForm);
  $('#exportBtn').addEventListener('click', exportBackup);
  $('#importBtn').addEventListener('click', () => importFile.click());
  $('#resetBtn').addEventListener('click', resetApp);
}

function saveSettingsForm() {
  const seen = new Set();
  for (const row of main.querySelectorAll('[data-edit-bucket]')) {
    const bucket = state.buckets.find((b) => b.id === row.dataset.editBucket);
    if (!bucket) continue;
    const name = row.querySelector('.name-input').value.trim().slice(0,40);
    const emoji = row.querySelector('.emoji-input').value.trim().slice(0,8) || '💰';
    const limit = Number(row.querySelector('.limit-input').value);
    if (!name) return notify('Every bucket needs a name.');
    if (seen.has(name.toLowerCase())) return notify('Bucket names must be unique.');
    if (!Number.isFinite(limit) || limit < 0 || limit > 100000000) return notify(`Invalid limit for ${name}.`);
    seen.add(name.toLowerCase());
    bucket.name = name;
    bucket.emoji = emoji;
    bucket.limit = Math.round(limit * 100) / 100;
  }
  const warn = Math.min(100, Math.max(1, Number($('#warnPercent')?.value) || 80));
  state.settings.warnAtPercent = warn;
  state.settings.lockAtLimit = $('#lockLimit')?.checked !== false;
  saveState();
  notify('Settings saved.');
  renderSettings();
}

function exportBackup() {
  const data = JSON.stringify({ exportedAt: new Date().toISOString(), state }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bucketpay-backup-${periodKey()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

importFile.addEventListener('change', async () => {
  const file = importFile.files?.[0];
  importFile.value = '';
  if (!file) return;
  try {
    const raw = JSON.parse(await file.text());
    const incoming = normalizeState(raw.state || raw);
    if (!confirm(`Import ${incoming.buckets.length} buckets and ${incoming.transactions.length} transactions? This replaces current local data.`)) return;
    state = incoming;
    saveState();
    notify('Backup imported.');
    renderSettings();
  } catch {
    notify('That backup file is invalid.');
  }
});

async function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  renderSettings();
}

function resetApp() {
  if (!confirm('Reset all BucketPay buckets and transaction history on this device?')) return;
  storageRemove(STORAGE_KEY);
  clearPending();
  state = defaultState();
  saveState();
  notify('BucketPay reset.');
  setRoute('home');
}

backBtn.addEventListener('click', () => {
  if (route.name === 'scanner') setRoute('home');
  else if (route.name === 'payment') setRoute('scanner', { bucketId: route.bucketId });
  else if (route.name === 'pending') setRoute('home');
  else if (route.name === 'addExpense') setRoute('home');
  else setRoute('home');
});
settingsBtn.addEventListener('click', () => setRoute('settings'));
navHome.addEventListener('click', () => setRoute('home'));
navHistory.addEventListener('click', () => setRoute('history'));
navSettings.addEventListener('click', () => setRoute('settings'));
quickAddBtn.addEventListener('click', () => setRoute('addExpense'));

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  installPrompt = event;
  if (route.name === 'settings') renderSettings();
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  notify('BucketPay installed.');
});

window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && launchedPendingThisSession && readPending()) {
    setTimeout(() => { if (readPending()) setRoute('pending'); }, 250);
  }
});
window.addEventListener('pageshow', () => {
  if (readPending() && launchedPendingThisSession) setRoute('pending');
});

// Standalone build intentionally does not register a service worker.

// If a pending payment survived a page close/reopen, surface it immediately.
if (readPending()) {
  launchedPendingThisSession = true;
  route = { name: 'pending' };
}
render();

</script>
</body>
</html>
